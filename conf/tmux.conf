set-option -g default-shell /bin/bash
set-option -g default-command "/bin/bash -l"

set -g mouse on
set -g history-limit 50000

set -g copy-command "pbcopy"

set -g set-titles on
set -g set-titles-string '[#{session_name}]'
set -g allow-passthrough on

# “:” 是单词边界，但 “-” 不是。
# 因此双击 lymFHFVJYQ2XM:account-platform 中的 platform
# 会选中 account-platform
set -g word-separators " :@_[]"

# 单击仍然正常传递，不因为单击进入 copy mode。
unbind-key -T root MouseDown1Pane

# 鼠标拖动结束后保留选区，不立即复制，也不退出 copy mode。
unbind-key -T copy-mode MouseDragEnd1Pane
unbind-key -T copy-mode-vi MouseDragEnd1Pane

# 需要复制时显式按 Enter。
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# 也可以在 vi copy mode 下按 y 复制。
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"